<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Ranakids - Хүүхдийн хувцас</title>
    <style>
        /* Вэбсайтын өнгө үзэмжийг тохируулах хэсэг (CSS) */
        body {
            background-color: #fce4ec; /* Зөөлөн ягаан суурь өнгө */
            font-family: Arial, sans-serif;
            text-align: center;
            color: #333333;
        }
        h1 {
            color: #e91e63; /* Ranakids брэндийн тод ягаан өнгө */
        }
        .product {
            background-color: white;
            width: 300px;
            padding: 20px;
            margin: 20px auto;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        img {
            width: 100%;
            border-radius: 5px;
        }
        .price {
            font-size: 20px;
            font-weight: bold;
            color: #ff5722;
        }
    </style>
</head>
<body>
    <h1>Ranakids дэлгүүрт тавтай морил! 🧸</h1>
    <p>Бид хамгийн сайн чанарын хүүхдийн монгол үндэсний дээл хувцасыг санал болгож байна.</p>
    
    <!-- Барааны мэдээлэл оруулах хэсэг -->
    <div class="product">
        <!-- Интернэтээс жишээ зураг орууллаа -->
        <img src="https://images.unsplash.com/photo-1519689680058-324335c77eba?auto=format&fit=crop&w=300&q=80" alt="Хүүхдийн хувцас">
        <h3>Өхөөрдөм цамц</h3>
        <p>100% хөвөн даавуун материалтай, биед эвтэйхэн.</p>
        <p class="price">35,000 ₮</p>
    </div>
    
    <p>Удахгүй манай вэбсайт бүрэн ашиглалтад орох болно. Бидэнтэй хамт байгаарай!</p>
</body>
</html>
