<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Ranakids - Хүүхдийн хувцас</title>
    <style>
        body {
            background-color: #fce4ec;
            font-family: Arial, sans-serif;
            text-align: center;
            color: #333333;
        }
        h1 {
            color: #e91e63;
        }
        .product {
            background-color: white;
            width: 300px;
            padding: 20px;
            margin: 20px auto;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        img {
            width: 100%;
            border-radius: 5px;
        }
        .price {
            font-size: 20px;
            font-weight: bold;
            color: #ff5722;
        }
        /* Фэйсбүүк товчлуурын загвар */
        .btn-order {
            display: inline-block;
            background-color: #1877F2;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <h1>Ranakids дэлгүүрт тавтай морил! 🧸</h1>
    <p>Бид хамгийн сайн чанарын монгол үндэсний хүүхдийн дээл хувцасыг санал болгож байна.</p>
    
    <div class="product">
        <img src="https://images.unsplash.com/photo-1519689680058-324335c77eba?auto=format&fit=crop&w=300&q=80" alt="Хүүхдийн хувцас">
        <h3>Өхөөрдөм цамц (Жишээ)</h3>
        <p>100% хөвөн даавуун материалтай, биед эвтэйхэн.</p>
        <p class="price">35,000 ₮</p>
        
        <!-- Захиалах товч -->
        <a href="https://www.facebook.com/" target="_blank" class="btn-order">Фэйсбүүкээр захиалах</a>
    </div>
    
    <p>Удахгүй манай вэбсайт бүрэн ашиглалтад орох болно. Бидэнтэй хамт байгаарай!</p>
</body>
</html>
